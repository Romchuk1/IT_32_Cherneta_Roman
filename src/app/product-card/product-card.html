<div class="product-card">

  <div class="product-image">
    <span>Товар</span>
  </div>

  <div class="product-info">

    <h2>{{ name }}</h2>

    <p class="description">
      Якісний товар для навчання, роботи та повсякденного використання.
    </p>

    <div class="bottom">

      <span class="price">
        {{ price }} грн
      </span>

      <button (click)="buy()">
        Купити
      </button>

    </div>

  </div>

</div>
