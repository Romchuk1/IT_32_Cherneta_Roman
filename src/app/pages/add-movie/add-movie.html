<h1>Додати фільм</h1>

<form #movieForm="ngForm" (ngSubmit)="addMovie(movieForm)">

  <label>Назва фільму:</label>

  <input
    type="text"
    name="title"
    [(ngModel)]="title"
    required
    minlength="3"
    maxlength="50"
    #titleRef="ngModel"
  >

  <div *ngIf="submitted && titleRef.invalid">
    <small *ngIf="titleRef.errors?.['required']">
      Назва обов'язкова
    </small>

    <small *ngIf="titleRef.errors?.['minlength']">
      Мінімум 3 символи
    </small>

    <small *ngIf="titleRef.errors?.['maxlength']">
      Максимум 50 символів
    </small>
  </div>

  <br>

  <label>Режисер:</label>

  <input
    type="text"
    name="director"
    [(ngModel)]="director"
    required
    minlength="3"
    maxlength="50"
    #directorRef="ngModel"
  >

  <div *ngIf="submitted && directorRef.invalid">
    <small *ngIf="directorRef.errors?.['required']">
      Режисер обов'язковий
    </small>

    <small *ngIf="directorRef.errors?.['minlength']">
      Мінімум 3 символи
    </small>

    <small *ngIf="directorRef.errors?.['maxlength']">
      Максимум 50 символів
    </small>
  </div>

  <br>

  <label>Опис:</label>

  <textarea
    name="description"
    [(ngModel)]="description"
    required
    minlength="10"
    #descriptionRef="ngModel"
  ></textarea>

  <div *ngIf="submitted && descriptionRef.invalid">
    <small *ngIf="descriptionRef.errors?.['required']">
      Опис обов'язковий
    </small>

    <small *ngIf="descriptionRef.errors?.['minlength']">
      Мінімум 10 символів
    </small>
  </div>

  <br>

  <button type="submit">Додати фільм</button>

</form>
